      question: Как възниква и се поддържа потенциалът на покой?
    - id: '2.3'
      title: Action Potentials and Axonal Conduction
      concept: Електрическа възбудимост
      question: Как се генерират и провеждат потенциалите на действие?
    - id: '2.4'
      title: Synaptic Transmission
      concept: Синаптична комуникация
      question: Как сигналът от един неврон променя активността на друга клетка?
    - id: '2.5'
      title: Neurotransmitters, Receptors and Synaptic Integration
      concept: Възбуждане, инхибиране и модулация
      question: Как различните рецептори и входящи сигнали определят невронния отговор?
  - number: 3
    title: Functional Neuroanatomy
    lessons:
    - id: '3.1'
