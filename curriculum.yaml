# Course curriculum — Master Lesson Index v1.3 (source: NS_Master_Curriculum_Control_v1_3.docx)
# Single source of truth for part/week/lesson titles, core concepts, guiding questions and week scope notes.
# Edit here, then run: python tools/build.py   (sidebar and week pages are regenerated from this)
# show_scope: false hides a week's scope note on the site.

course: The Nervous System — One Concept at a Time
version: '1.3'
parts:
- number: 1
  roman: I
  title: Невробиологични основи
  weeks:
  - number: 1
    title: Организация на нервната система
    scope: Съдържанието и петте заглавия остават непроменени; готовите файлове не се редактират.
    show_scope: false
    lessons:
    - id: '1.1'
      title: What Is the Nervous System?
      concept: Функционална организация
      question: Как нервната система участва в координацията на организма?
    - id: '1.2'
      title: The Cells of the Nervous System
      concept: Клетъчна специализация
      question: Как невроните и глията правят възможно нервното функциониране?
    - id: '1.3'
      title: Central and Peripheral Nervous Systems
      concept: Анатомична организация
      question: Как са организирани ЦНС и ПНС и как взаимодействат?
    - id: '1.4'
      title: Afferent and Efferent Pathways
      concept: Посока на сигнализацията
      question: Как информацията достига до ЦНС и как от нея се организират реакции?
    - id: '1.5'
      title: Neural Circuits and Functional Integration
      concept: Невронни вериги
      question: Как невронните вериги координират информацията в организирани реакции?
  - number: 2
    title: Невронна сигнализация — необходимият минимум
    scope: Електрохимичните градиенти и потенциалът на покой се обединяват. Нернст/GHK и каналната кинетика са допълнителен, незадължителен материал; запазват се причинните механизми.
    show_scope: false
    lessons:
    - id: '2.1'
      title: Ion Gradients and the Resting Neuron
      concept: Йонни градиенти и потенциал на покой
      question: Как мембраната и йонните градиенти създават електрически условия за нервна сигнализация?
    - id: '2.2'
      title: Action Potentials as Neural Signals
      concept: Потенциал на действие и провеждане
      question: Как невронът генерира и провежда електрически сигнал, без да „предава“ същия заряд по цялата си дължина?
    - id: '2.3'
      title: Synaptic Communication Between Neurons
      concept: Синаптично предаване
      question: Как активността на един неврон променя вероятността за активност на следващия?
    - id: '2.4'
      title: Excitation, Inhibition and Neural Integration
      concept: Интеграция на възбудни и инхибиторни влияния
      question: Как множество входящи сигнали заедно определят отговора на неврона?
    - id: '2.5'
      title: Neuromodulation, Metabolic Support and Network State
      concept: Невромодулация и енергийни ограничения
      question: Как химичната модулация и енергийното осигуряване променят функционирането на невронните вериги?
  - number: 3
    title: Функционална невроанатомия
    scope: 'Анатомията се преподава функционално: структури → вериги → регулирани функции → поведение; без каталози от ядра и кортикални полета.'
    lessons:
    - id: '3.1'
      title: Brainstem and Spinal Cord
      concept: Мозъчностволова и спинална организация
      question: Как мозъчният ствол и гръбначният мозък участват в основните нервни функции?
    - id: '3.2'
      title: Thalamus and Hypothalamus
      concept: Подкорова интеграция
      question: Какви различни функции изпълняват таламусът и хипоталамусът?
    - id: '3.3'
      title: Basal Ganglia and Cerebellum
      concept: Подбор, координация и адаптация на действията
      question: Как базалните ганглии и малкият мозък участват в контрола на поведението?
    - id: '3.4'
      title: Cerebral Cortex and Functional Specialization
      concept: Кортикална организация
      question: Как мозъчната кора поддържа специализирани и взаимосвързани функции?
    - id: '3.5'
      title: Distributed Brain Networks and Neurovascular Support
      concept: Мрежова организация и мозъчно кръвоснабдяване
      question: Как мозъчните мрежи функционират при постоянни енергийни и съдови ограничения?
  - number: 4
    title: Сетивност, възприятие и действие
    scope: 'Обединени са две оригинални седмици: трансдукцията по модалности се използва като пример, а не като отделен подробен курс по зрение, слух, вкус и обоняние.'
    show_scope: false
    lessons:
    - id: '4.1'
      title: Sensory Transduction and Neural Coding
      concept: Сетивна трансдукция и кодиране
      question: Как нервната система преобразува промени в средата и тялото в нервна информация?
    - id: '4.2'
      title: Somatosensation, Proprioception and Body Position
      concept: Телесна сетивност и проприоцепция
      question: Как сигналите за допир и положение на тялото участват в ориентацията и действието?
    - id: '4.3'
      title: Vestibular Signals, Balance and Orientation
      concept: Вестибуларно усещане и ориентация
      question: Как сигналите за движение на главата участват в равновесието и координацията?
    - id: '4.4'
      title: Multisensory Integration and Active Perception
      concept: Сетивна интеграция и активно възприятие
      question: Как мозъкът комбинира зрителни, слухови и други сигнали с контекста и очакванията?
    - id: '4.5'
      title: Motor Control, Feedback and Spinal Reflexes
      concept: Двигателен контрол и обратна връзка
      question: Как низходящите сигнали и спиналните вериги координират действие и постурален контрол?
  - number: 5
    title: Невропластичност, учене и памет
    scope: Механизми на пластичност и учене без излишна молекулярна или генна подробност; ген–среда остава в развойната перспектива.
    lessons:
    - id: '5.1'
      title: Synaptic Plasticity
      concept: Синаптична пластичност
      question: Как активността променя ефективността на синаптичните връзки?
    - id: '5.2'
      title: Experience-Dependent Circuit Plasticity
      concept: Зависима от опита промяна
      question: Как опитът променя организацията и функцията на невронните вериги?
    - id: '5.3'
      title: Associative and Non-Associative Learning
      concept: Основни механизми на учене
      question: Как опитът води до трайни промени в реакциите?
    - id: '5.4'
      title: Memory Systems and Consolidation
      concept: Памет и консолидация
      question: Как различните системи участват във формирането и стабилизирането на паметта?
    - id: '5.5'
      title: Genetic Regulation, Experience and Plasticity
      concept: Генна експресия и взаимодействие ген–среда
      question: Как генетичните механизми, регулацията на генната експресия и опитът взаимодействат при невронната пластичност?
- number: 2
  roman: II
  title: Физиологична регулация и мозък–тяло
  weeks:
  - number: 6
    title: Автономна нервна система
    scope: Запазени са структурните разлики между симпатиков, парасимпатиков и ентерален контрол; функционално, а не фармакологично обучение.
    lessons:
    - id: '6.1'
      title: Autonomic and Somatic Organization
      concept: Автономни и соматични пътища
      question: Как автономната регулация се различава от соматичния двигателен контрол?
    - id: '6.2'
      title: Sympathetic Pathways and Organ Effects
      concept: Симпатикова организация
      question: Как симпатиковите пътища влияят върху различни органи?
    - id: '6.3'
      title: Parasympathetic Pathways and Organ Effects
      concept: Парасимпатикова организация
      question: Как парасимпатиковите пътища регулират органните функции?
    - id: '6.4'
      title: Autonomic Neurotransmission and Receptors
      concept: Автономна неврохимия
      question: Как невротрансмитерите и рецепторите определят специфичните органни ефекти?
    - id: '6.5'
      title: Enteric Neural Circuits
      concept: Ентерална нервна система
      question: Как чревните невронни мрежи координират храносмилането и взаимодействат с външната инервация?
  - number: 7
    title: Централна автономна регулация
    scope: Конкретни пътища на централна автономна регулация; без ненужна специализирана номенклатура.
    lessons:
    - id: '7.1'
      title: Visceral Afferent Pathways
      concept: Висцерална аферентация
      question: Как физиологичните сигнали от органите достигат централните регулаторни структури?
    - id: '7.2'
      title: Brainstem Autonomic Nuclei
      concept: Мозъчностволов автономен контрол
      question: Как NTS, nucleus ambiguus и dorsal motor nucleus участват в автономните функции?
    - id: '7.3'
      title: Hypothalamic Integration
      concept: Хипоталамична регулация
      question: Как хипоталамусът координира автономни, ендокринни и поведенчески реакции?
    - id: '7.4'
      title: Cortical and Subcortical Autonomic Modulation
      concept: Низходящ автономен контрол
      question: Как кортикалните и подкорковите структури влияят върху висцералната регулация?
    - id: '7.5'
      title: The Central Autonomic Network
      concept: Разпределена автономна организация
      question: Как взаимодействието между централните структури координира автономните реакции?
  - number: 8
    title: Кардиореспираторна физиология
    scope: Барорефлекс, дишане и взаимодействия — достатъчно, за да се оценяват по-късно HRV/RSA; без клинична електрофизиология.
    lessons:
    - id: '8.1'
      title: Cardiac Pacemaking and Autonomic Control
      concept: Сърдечен ритъм
      question: Как пейсмейкърната активност и автономните влияния определят сърдечната честота?
    - id: '8.2'
      title: Blood Pressure and Baroreflex Regulation
      concept: Барорефлекс
      question: Как нервната система открива и компенсира краткосрочни промени в кръвното налягане?
    - id: '8.3'
      title: Respiratory Mechanics and Gas Exchange
      concept: Вентилация и газообмен
      question: Как дишането осигурява обмена на кислород и въглероден диоксид?
    - id: '8.4'
      title: Neural and Chemical Control of Breathing
      concept: Дихателен контрол
      question: Как невронните генератори на дихателния ритъм и хеморецепторите регулират вентилацията?
    - id: '8.5'
      title: Cardiorespiratory Interactions
      concept: Сърдечно-дихателна координация
      question: Как дишането, барорефлексът и автономните влияния взаимодействат?
  - number: 9
    title: Хомеостаза, алостаза и енергийна регулация
    scope: 'Регулацията се разглежда в контекст: обратна връзка, предвиждане, енергийни нужди; без телеологични опростявания.'
    lessons:
    - id: '9.1'
      title: Homeostatic Regulation
      concept: Хомеостаза
      question: Как организмът поддържа физиологичните параметри в жизнеспособни граници?
    - id: '9.2'
      title: Feedback and Anticipatory Control
      concept: Обратна връзка и предвиждащ контрол
      question: Как реактивните и предвиждащите механизми допринасят за регулацията?
    - id: '9.3'
      title: Allostasis as a Regulatory Framework
      concept: Алостаза
      question: Какво добавя концепцията за алостаза към разбирането за физиологична регулация?
    - id: '9.4'
      title: Energy Balance, Hunger and Satiety
      concept: Енергийни потребности
      question: Как невронните и хормоналните механизми координират приема и използването на енергия?
    - id: '9.5'
      title: Regulation Across Physiological Contexts
      concept: Контекстна адаптация
      question: Защо оптималната физиологична реакция зависи от активността, средата и потребностите?
  - number: 10
    title: Интероцепция
    scope: Разграничават се измерими телесни сигнали, субективна увереност и конструирани интерпретации; без диагностични изводи.
    lessons:
    - id: '10.1'
      title: Defining Interoception
      concept: Интероцептивен домейн
      question: Какво представлява интероцепцията и къде са границите на понятието?
    - id: '10.2'
      title: Visceral Receptors and Interoceptive Pathways
      concept: Висцерална сетивна сигнализация
      question: Как вътрешните физиологични промени се регистрират и предават?
    - id: '10.3'
      title: Central Interoceptive Processing
      concept: Мозъчна обработка на телесни сигнали
      question: Как централните мрежи интегрират информацията за вътрешното състояние?
    - id: '10.4'
      title: Interoceptive Accuracy, Attention and Beliefs
      concept: Интероцептивни измерения
      question: Как се различават точността, вниманието и убежденията за собствените телесни усещания?
    - id: '10.5'
      title: Prediction and Interoceptive Experience
      concept: Предвиждане и телесно възприятие
      question: Как очакванията и входящите сигнали взаимодействат при интероцептивното преживяване?
  - number: 11
    title: Ноцицепция и болка
    scope: Болката не се отъждествява с ноцицепция; ограничават се клиничните протоколи.
    lessons:
    - id: '11.1'
      title: Nociceptors and Nociceptive Transduction
      concept: Ноцицептивни рецептори
      question: Как потенциално увреждащи стимули активират ноцицептивните системи?
    - id: '11.2'
      title: Spinal Processing and Ascending Pathways
      concept: Ноцицептивно предаване
      question: Как ноцицептивните сигнали се обработват в гръбначния мозък и достигат мозъка?
    - id: '11.3'
      title: Pain as a Multidimensional Experience
      concept: Болково преживяване
      question: Защо болката не е идентична с ноцицепцията или тъканното увреждане?
    - id: '11.4'
      title: Descending Pain Modulation
      concept: Централна модулация
      question: Как мозъчните системи могат да потискат или усилват ноцицептивното предаване?
    - id: '11.5'
      title: Sensitization, Learning and Pain Context
      concept: Сенситизация и контекст
      question: Как пластичността, очакванията и опитът могат да влияят върху болката?
  - number: 12
    title: Невроендокринна регулация
    scope: Обясняват се физиологични пътища и време на реакция, без терапевтични препоръки.
    lessons:
    - id: '12.1'
      title: Neuroendocrine Communication
      concept: Нервно-хормонална сигнализация
      question: Как нервната система координира ендокринните функции?
    - id: '12.2'
      title: Hypothalamic–Pituitary Organization
      concept: Хипоталамо-хипофизна регулация
      question: Как са организирани основните невроендокринни контролни пътища?
    - id: '12.3'
      title: The HPA Axis
      concept: HPA регулация
      question: Как се активира и регулира хипоталамо-хипофизо-надбъбречната ос?
    - id: '12.4'
      title: Sympathoadrenal and Endocrine Responses
      concept: Симпатоадренална реакция
      question: Как се координират бързите автономни и хормонални реакции при натоварване?
    - id: '12.5'
      title: Hormonal Feedback and Physiological Adaptation
      concept: Ендокринна обратна връзка
      question: Как хормоналната сигнализация се регулира във времето и се адаптира към физиологичните условия?
  - number: 13
    title: Сън и циркадни ритми
    scope: Сънят се изучава като регулаторен процес, с примери за поведение и памет; без подробна сомнология.
    lessons:
    - id: '13.1'
      title: Circadian Clocks and Biological Timing
      concept: Циркадна организация
      question: Как супрахиазматичното ядро и периферните часовници координират биологичните ритми?
    - id: '13.2'
      title: Sleep Homeostasis and Sleep Pressure
      concept: Хомеостатичен натиск за сън
      question: Как се променя потребността от сън в зависимост от времето на бодърстване и предишния сън?
    - id: '13.3'
      title: Neural Circuits of Sleep and Wakefulness
      concept: Невронен контрол на съня
      question: Как мозъчните мрежи регулират преходите между бодърстване и сън?
    - id: '13.4'
      title: NREM, REM and Sleep Architecture
      concept: Сънни стадии
      question: Как се различават NREM и REM сънят по мозъчна и физиологична активност?
    - id: '13.5'
      title: Sleep, Memory and Physiological Regulation
      concept: Функции и последствия на съня
      question: Как сънят и неговото нарушаване влияят върху паметта, метаболизма и регулацията?
  - number: 14
    title: Невроимунна комуникация
    scope: Невроимунната комуникация се разглежда със строго разграничаване на човешки данни и животински модели.
    lessons:
    - id: '14.1'
      title: Routes of Brain–Immune Communication
      concept: Невроимунни комуникационни пътища
      question: По какви нервни, хуморални и клетъчни пътища мозъкът и имунната система взаимодействат?
    - id: '14.2'
      title: Cytokine Signaling and Brain Function
      concept: Цитокинова сигнализация
      question: Как имунните медиатори могат да влияят върху мозъчната функция?
    - id: '14.3'
      title: Microglia and Neuroinflammatory Processes
      concept: Микроглиална и възпалителна активност
      question: Как клетките на ЦНС участват в имунните и възпалителните процеси?
    - id: '14.4'
      title: Sickness Behavior and Gut–Brain–Immune Interactions
      concept: Имунно обусловено поведение
      question: Как имунните сигнали и комуникацията черва–мозък могат да влияят върху поведението?
    - id: '14.5'
      title: Neural Modulation of Immune Responses
      concept: Невронно-имунна регулация
      question: Как автономните и централните механизми могат да модулират имунната активност?
- number: 3
  roman: III
  title: Психофизиологични измервания и критичен преглед на поливагалните модели
  weeks:
  - number: 15
    title: Психофизиологични измервания
    scope: Показателите не се превръщат в директни етикети за психологически състояния; HRV/RSA са контекстно зависими.
    lessons:
    - id: '15.1'
      title: Physiological Measurement and Interpretation
      concept: Измерване и причинен извод
      question: Какво можем и какво не можем да заключим от периферни физиологични показатели?
    - id: '15.2'
      title: Heart Rate Variability
      concept: HRV
      question: Как се измерва вариабилността на сърдечната честота и от какво зависи?
    - id: '15.3'
      title: Respiratory Sinus Arrhythmia
      concept: RSA
      question: Как възниква RSA и при какви условия отразява сърдечни вагални влияния?
    - id: '15.4'
      title: Electrodermal and Respiratory Measurements
