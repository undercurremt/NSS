    .nav-hint {

      bottom: 20px;
      right: 20px;
      font-size: 0.55em;
      color: rgba(255,255,255,0.3);

    .toc-grid {

      grid-template-columns: repeat(2, 1fr);
      gap: 0.6em;
      font-size: 0.7em;
      text-align: left;

    .toc-item {

    .toc-item .part-num { color: var(--ns-orange); font-weight: bold; }
    .toc-item .part-name { color: var(--ns-light); }
    .toc-item .part-weeks { color: #aaa; font-size: 0.9em; }
