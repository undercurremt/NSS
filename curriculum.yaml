      concept: Обоняние и вкус
      question: Как химичните стимули се разпознават и интегрират в нервната система?
    - id: '5.4'
      title: Multisensory Integration
      concept: Мултисензорна обработка
      question: Как мозъкът комбинира информация от различни сетивни модалности?
    - id: '5.5'
      title: From Sensation to Perception
      concept: Сетивност и възприятие
      question: Защо възприятието не представлява просто пасивно копие на сетивните сигнали?
  - number: 6
    title: Neuroplasticity, Learning & Memory
    lessons:
    - id: '6.1'
      title: Synaptic Plasticity
