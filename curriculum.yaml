# Course curriculum — single source of truth for titles, core concepts and guiding questions.
# Edit here, then run: python tools/build.py   (sidebar and week pages are regenerated from this)

course: The Nervous System — One Concept at a Time
parts:
- number: 1
  title: Neurobiological Foundations
  weeks:
  - number: 1
    title: Organisation of the Nervous System
    lessons:
    - id: '1.1'
      title: What Is the Nervous System?
      concept: Функционална организация
      question: Как нервната система участва в координацията на организма?
    - id: '1.2'
      title: The Cells of the Nervous System
      concept: Клетъчна специализация
      question: Как невроните и глията правят възможно нервното функциониране?
    - id: '1.3'
      title: Central and Peripheral Nervous Systems
      concept: Анатомична организация
      question: Как са организирани ЦНС и ПНС и как взаимодействат?
    - id: '1.4'
      title: Afferent and Efferent Pathways
      concept: Посока на сигнализацията
      question: Как информацията достига до ЦНС и как от нея се организират реакции?
    - id: '1.5'
      title: Neural Circuits and Functional Integration
      concept: Невронни вериги
      question: Как невронните вериги координират информацията в организирани реакции?
  - number: 2
    title: Cellular Physiology & Neural Signalling
    lessons:
    - id: '2.1'
      title: Membranes, Ion Gradients and Cellular Energy
      concept: Електрохимични градиенти и енергийни потребности
      question: Как клетките поддържат условията, необходими за нервна сигнализация?
    - id: '2.2'
